name: Refresh history and publish Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'historical_data/generated/**'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: history-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release metadata needs the commit that last changed sw.js, which may be older
          # than the latest scheduled data refresh.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r tools/history/requirements.txt
      - run: python -m unittest discover -s tools/history -p 'test_*.py'
      - run: python tools/history/collect.py
        if: github.event_name != 'push'
      - name: Refresh observed EU living costs
        id: living
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/history/living_eu.py
      - name: Report living-cost failure
        if: steps.living.outcome == 'failure'
        run: echo 'EU living-cost refresh failed. Previous complete snapshot retained; inspect the Eurostat/Commission/FX step.' >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh Bitcoin news
        id: news
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/news/collect.py
      - name: Refresh official Bark pricing
        id: bark_pricing
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python -m unittest discover -s tools/bark-pricing -p 'test_*.py'
          python tools/bark-pricing/collect.py
      - name: Report Bark pricing failure
        if: steps.bark_pricing.outcome == 'failure'
        run: echo 'Bark pricing refresh failed. The previous verified snapshot was retained.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report news failure
        if: steps.news.outcome == 'failure'
        run: echo 'Bitcoin news refresh failed. The previous snapshot was retained.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report provider failures
        if: always()
        run: |
          if test -f historical_data/generated/status.json; then
            cat historical_data/generated/status.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit refreshed datasets
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical_data/generated news-data.json bark-pricing.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh site datasets'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/configure-pages@v6
      - name: Prepare static site
        run: |
          mkdir /tmp/satoshi-pages
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='tools/' --exclude='tests/' --exclude='services/' --exclude='__pycache__/' ./ /tmp/satoshi-pages/
          PWA_VERSION="$(sed -n "s/^const CACHE = 'satoshi-static-\(v[0-9][0-9]*\)'.*/\1/p" sw.js)"
          PWA_COMMIT="$(git log -1 --format=%H -- sw.js)"
          PWA_UPDATED_AT="$(git log -1 --format=%cI -- sw.js)"
          test -n "$PWA_VERSION" && test -n "$PWA_COMMIT" && test -n "$PWA_UPDATED_AT"
          printf '{"version":"%s","commit":"%s","updatedAt":"%s"}\n' \
            "$PWA_VERSION" "$PWA_COMMIT" "$PWA_UPDATED_AT" > /tmp/satoshi-pages/pwa-release.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/satoshi-pages
          # `.well-known/` is a dot directory, and it is where the site's NIP-05 document and every
          # Lightning address alias live. v5 stopped including hidden files by default, so without this
          # line a version bump would publish a site whose .well-known answers 404.
          include-hidden-files: true
      # GitHub's own answer to "Fetching artifact metadata failed" is to re-run the deployment later.
      # One retry inside the run turns that flake into a release instead of a site that silently stays on
      # the previous build. The artifact is already in the run, so the second call costs a few seconds.
      #
      # continue-on-error is what keeps the recovered run green: without it the failed first attempt marks
      # the job failed and the retry publishes the site anyway, so a successful release reads as a broken
      # one — which is exactly how this went unnoticed for four days.
      - uses: actions/deploy-pages@v5
        id: deployment
        continue-on-error: true
      - name: Retry Pages deployment once
        id: deployment_retry
        # Not failure(): after continue-on-error the job is not failed, and the retry would never run.
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
