<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pinstr card</title>
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #2b1a0c url('/img/board-cork.png') repeat;
    background-size: 420px 420px;
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  /* soft light from the top, and the corners fall away: the board's own vignette */
  .card::before { content: ''; position: absolute; inset: 0; background:
      radial-gradient(120% 85% at 50% 0%, rgba(255,226,176,.10), rgba(0,0,0,0) 55%),
      radial-gradient(130% 120% at 50% 40%, rgba(0,0,0,0) 42%, rgba(0,0,0,.62) 100%); }
  .wordmark { position: absolute; left: 72px; top: 132px; }
  .wordmark h1 { margin: 0; font-size: 104px; line-height: .9; letter-spacing: -.035em; color: #fdf3d9; text-shadow: 0 4px 22px rgba(0,0,0,.65); }
  .rule { width: 104px; height: 7px; margin: 26px 0 0; border-radius: 4px; background: linear-gradient(#e6c98d, #9b7534); box-shadow: 0 2px 8px rgba(0,0,0,.55); }
  .wordmark p { margin: 26px 0 0; width: 430px; font-size: 26px; line-height: 1.35; color: #f0e2c0; text-shadow: 0 2px 14px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.6); }
  .note {
    position: absolute; box-sizing: border-box; width: 208px; height: 208px; padding: 22px 18px;
    display: grid; place-items: center; text-align: center;
    color: #26231e; font-size: 19px; line-height: 1.28;
    border-radius: 2px; box-shadow: 0 14px 26px rgba(0,0,0,.5), inset 0 -18px 26px rgba(0,0,0,.06);
  }
  .note em { font-style: normal; }
  .yellow { background: #f7dc63; }
  .pink { background: #f3a7c4; }
  .blue { background: #91d2eb; }
  .green { background: #acd986; }
  .pin { position: absolute; top: -30px; width: 38px; height: 38px; translate: -50% 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">
    <h1>Pinstr</h1>
    <div class="rule"></div>
    <p>Temporary notes on<br>public geohash boards.</p>
  </div>

  <div class="note yellow" style="left: 624px; top: 76px; rotate: -5deg">
    <img class="pin" style="left: 50%" src="/img/pin_red.png" alt="">
    <em>meet at the crag, 8am</em>
  </div>
  <div class="note blue" style="left: 874px; top: 52px; rotate: 3.5deg">
    <img class="pin" style="left: 50%" src="/img/pin_blue.png" alt="">
    <em>gm u267</em>
  </div>
  <div class="note pink" style="left: 652px; top: 350px; rotate: 2.5deg">
    <img class="pin" style="left: 50%" src="/img/pin_black.png" alt="">
    <em>zap this note</em>
  </div>
  <div class="note green" style="left: 906px; top: 336px; rotate: -6deg">
    <img class="pin" style="left: 50%" src="/img/pin_white.png" alt="">
    <em>gone in 6 days</em>
  </div>
</div>
</body>
</html>
