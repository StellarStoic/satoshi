name: Refresh history and publish Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'historical_data/generated/**'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: history-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/history/requirements.txt
      - run: pip install -r tools/history/requirements.txt
        if: github.event_name != 'push'
      - run: python -m unittest discover -s tools/history -p 'test_*.py'
      - run: python tools/history/collect.py
        if: github.event_name != 'push'
      - name: Report provider failures
        if: always()
        run: |
          if test -f historical_data/generated/status.json; then
            cat historical_data/generated/status.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit refreshed datasets
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical_data/generated
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh BTC-denominated market history'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir /tmp/satoshi-pages
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='tools/' --exclude='tests/' --exclude='__pycache__/' ./ /tmp/satoshi-pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/satoshi-pages
      - uses: actions/deploy-pages@v4
        id: deployment
